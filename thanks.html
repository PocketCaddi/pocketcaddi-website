<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’re on the list · PocketCaddi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11271d">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600&display=swap">
<style>
:root { --bg:#11271d; --fg:#f4ede0; --muted:#bdb7a6; --accent:#b8884a; --accent-hi:#d4a766; --line:rgba(244,237,224,.13); color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:400 1rem/1.65 "Inter",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:720px; margin-inline:auto; padding-inline:20px; padding-block:40px 80px; }
.top { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-bottom:40px; border-bottom:1px solid var(--line); margin-bottom:48px; }
.logo { display:flex; align-items:center; gap:10px; font-family:"Fraunces",Georgia,serif; font-size:1.3rem; text-decoration:none; color:var(--fg); }
a { color:var(--accent-hi); }
h1,h2 { font-family:"Fraunces",Georgia,serif; font-weight:400; line-height:1.1; text-wrap:balance; }
h1 { font-size:clamp(2.2rem,5vw,3.2rem); margin:0 0 16px; }
h2 { font-size:1.4rem; margin:40px 0 10px; }
p, li { color:var(--muted); }
strong { color:var(--fg); font-weight:500; }
.btn { display:inline-block; margin-top:24px; padding:13px 20px; border-radius:999px; background:var(--accent); color:#1b2a22; font-weight:600; text-decoration:none; }
.btn:hover { background:var(--accent-hi); }
:focus-visible { outline:2px solid var(--accent-hi); outline-offset:3px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="/"><img src="/assets/logo.png" alt="" width="31" height="40">PocketCaddi</a><a href="/">Back to home</a></header>
  <main>
    <h1>You're on the list.</h1>
    <p>We'll email you before PocketCaddi launches, with early access first. Until then, the TikTok is where the updates happen.</p>
    <a class="btn" href="/">Back to PocketCaddi</a>
  </main>
</div>
</body>
</html>
